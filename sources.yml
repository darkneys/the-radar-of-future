# Список источников. Чтобы добавить новый, скопируй блок и поменяй поля.
# type: telegram  -> читает публичный канал через t.me/s/<channel>
# type: rss       -> читает RSS-ленту (list_url = адрес ленты)
# type: site      -> сначала ищет на странице разметку JSON-LD (Event), потом пробует CSS-селекторы
# sec: conf | grant | case | intern | school | other   (раздел сайта по умолчанию; старое summit = conf)
# include: слова-фильтры (регулярка), посты без них пропускаются
defaults:
  max_age_days: 90
  min_score: 2   # чем выше, тем строже фильтр (3 = только явные возможности с датой, ценой или дедлайном)
sources:
  - name: Яков и Партнёры (канал YnP life)
    type: telegram
    channel: YnPlife
    org: Яков и Партнёры
    sec: intern
    country: Россия
    rf: да
    tr: проверить
    include: "стажир|набор|программ|кейс|заявк"
    enabled: true

