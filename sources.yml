  #   country: Россия
  #   rf: да
  #   tr: проверить
  #   include: "стажир|школ|кейс|конференц|грант"
  #   enabled: true

  # Сюда добавляй источники вручную (например, новые Telegram-каналы).
  # Остальные источники берутся из таблицы: data/istochniki.xlsx -> python table_to_sources.py -> sources_table.yml
