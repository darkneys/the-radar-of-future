name: daily-parse
on:
  schedule: [{cron: "0 6 * * *"}]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python parse.py
      - name: Commit
        run: |
          git config user.name "radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/events.json docs/radar.html
          git diff --cached --quiet || (git commit -m "daily update" && git push)
