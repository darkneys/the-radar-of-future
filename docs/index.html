 const f=cur==="src"?[["q","text","Поиск…"],["cat","sel","Все категории",uniq(D,"cat")],["prio","sel","Любой приоритет",["высокий","средний","низкий"]],["pass","pass"]]:
 [["q","text","Поиск…"],["country","sel","Все страны",uniq(D,"country")],["org","sel","Все организации",uniq(D,"org")],["fmt","sel","Любой формат",uniq(D,"fmt")],["pass","pass"]];
 $("bar").innerHTML=f.map(x=>x[1]==="text"?'<input data-k="q" placeholder="'+x[2]+'">':x[1]==="pass"?'<select data-k="pass"><option value="">Любой паспорт</option><option value="rf">Доступно РФ</option><option value="tr">Доступно ТР</option></select>':'<select data-k="'+x[0]+'">'+opts(x[2],x[3])+'</select>').join('')}
$("bar").oninput=e=>{F[e.target.dataset.k]=e.target.value;draw()};
const link=s=>/^[a-z0-9.-]+\.[a-z]{2,}(\/\S*)?$/i.test(s)?'<a href="https://'+s+'" target="_blank" rel="noopener">'+s+'</a>':s;
function pass(d){return !F.pass||(F.pass==="rf"?ok(d.rf):ok(d.tr))}
function draw(){const q=(F.q||"").toLowerCase();let h;
 if(cur==="src"){const L=SRC.filter(d=>(!q||(d.name+d.what+d.cat).toLowerCase().includes(q))&&(!F.cat||d.cat===F.cat)&&(!F.prio||d.prio===F.prio)&&pass(d));
  $("cnt").textContent="Найдено: "+L.length+" из "+SRC.length;
  h=L.map(d=>'<div class="card"><div class="top"><div><div class="nm">'+d.name+'</div><div class="org">'+d.cat+'</div></div><span class="b wn">'+d.prio+'</span></div><p>'+d.what+'</p><div class="tags"><span class="t">'+d.type+'</span><span class="t">РФ: '+d.rf+'</span><span class="t">ТР: '+d.tr+'</span><span class="t">'+d.method+'</span></div><p>'+link(d.site)+'</p></div>').join('')}
 else{const L=EV.filter(d=>d.sec===cur&&(!q||(d.title+d.org+d.desc+d.place).toLowerCase().includes(q))&&(!F.country||d.country===F.country)&&(!F.org||d.org===F.org)&&(!F.fmt||d.fmt===F.fmt)&&pass(d));
  $("cnt").textContent="Найдено: "+L.length;
  h=L.map(d=>'<div class="card"><div class="top"><div><div class="nm">'+d.title+'</div><div class="org">'+d.org+'</div></div><span class="b '+(d.ok?"ok":"wn")+'">'+(d.ok?"проверено":"уточнить")+'</span></div><dl><dt>Место</dt><dd>'+d.country+', '+d.place+'</dd><dt>Формат</dt><dd>'+d.fmt+'</dd><dt>Даты</dt><dd>'+d.dates+'</dd><dt>Дедлайн</dt><dd>'+d.dl+'</dd><dt>Стоимость</dt><dd>'+d.cost+'</dd><dt>Условия</dt><dd>'+d.cond+'</dd></dl><p>'+d.desc+'</p><div class="tags"><span class="t">РФ: '+d.rf+'</span><span class="t">ТР: '+d.tr+'</span></div><p><a href="'+d.url+'" target="_blank" rel="noopener">Официальный сайт</a></p></div>').join('')}
 $("list").innerHTML=h||'<p class="cnt">Ничего не найдено.</p>'}
const hs=location.hash.slice(1);if(SEC.some(s=>s[0]===hs))cur=hs;
fetch("events.json").then(r=>r.json()).then(j=>{EV=j.events;$("sub").textContent+=" Обновлено: "+j.updated+"."}).catch(()=>{$("sub").textContent+=" (не удалось загрузить events.json)"}).finally(()=>{nav();bar();draw()});
</script></body></html>
